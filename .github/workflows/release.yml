name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x test_android/gradlew

      - name: Build APK (Debug / Auto-Signed)
        run: cd test_android && ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release_output
          cp test_android/app/build/outputs/apk/debug/app-debug.apk release_output/loterias.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/loterias.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
