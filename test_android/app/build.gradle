plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def getGitVersionCode() {
    if (project.hasProperty('versionCode')) {
        return project.property('versionCode').toInteger()
    }
    if (System.getenv("VERSION_CODE")) {
        return System.getenv("VERSION_CODE").toInteger()
    }
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = stdout
        }
        return Math.max(stdout.toString().trim().toInteger(), 2)
    } catch (Exception ignored) {
        return 2
    }
}

def getGitVersionName(int code) {
    if (project.hasProperty('versionName')) {
        return project.property('versionName')
    }
    if (System.getenv("VERSION_NAME")) {
        return System.getenv("VERSION_NAME")
    }
    return "1.0.${code}"
}

def appVersionCode = getGitVersionCode()
def appVersionName = getGitVersionName(appVersionCode)

android {
    namespace 'com.loterias.app'
    compileSdk 33
    defaultConfig {
        applicationId "com.loterias.app"
        minSdk 24
        targetSdk 33
        versionCode appVersionCode
        versionName appVersionName
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Retrofit & Gson para consumir la API JSON
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    
    // Jsoup para parsing HTML directo del sitio web
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
